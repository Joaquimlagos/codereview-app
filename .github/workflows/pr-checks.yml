# CONFIGURATION REQUIRED — codereview-infra is deployed and these AWS
# resources exist; what's missing is registering their values by hand in
# this repo's GitHub settings (Settings > Secrets and variables > Actions).
# Until then the "trigger-review" job fails at the AWS authentication step:
#   - Secret   AWS_ROLE_ARN           — `terraform output -raw github_actions_pr_review_role_arn` in codereview-infra
#   - Variable ARTIFACTS_BUCKET_NAME  — the shared artifacts S3 bucket (codereview-artifacts),
#                                       which holds PR diffs under prs/ and the RAG index under index/
#   - Variable EVENT_BUS_NAME         — the EventBridge bus name (codereview-bus)
# See README.md, section "Pending configuration".
name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # Blocking: gates merging. Runs on both triggers (no "if" — it runs
  # whenever the workflow itself runs), so main stays green on direct
  # pushes too. Point branch protection's required check at this exact job
  # name ("test").
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test

  # Independent of "test" (no "needs"). Merging is gated by branch protection,
  # which requires only the "test" check, so a failure here reports red without
  # blocking the merge. "continue-on-error" is deliberately not used: it also
  # suppresses the red, and that is what hid a broken diff step here for days.
  #
  # Only the publishing side of the pipeline runs in this job — compute the
  # diff, upload it, emit the event. The model calls happen afterwards inside
  # the Step Functions execution, so an unavailable LLM cannot fail this check.
  #
  # PR-only: on a direct push to main there's no PR to diff against or to
  # comment on, so this job is skipped entirely on that trigger.
  trigger-review:
    name: Trigger AI review pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff against base branch
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          CONFIG_FILE: .codereview.yml
        run: |
          # Full history of the base branch, not --depth=1. Checkout resolves the
          # PR's merge ref, whose first parent is the base tip as of when GitHub
          # last computed that ref, and --depth=1 truncates origin/<base> to a
          # single parentless commit. That only breaks when the merge ref is stale
          # relative to the base branch — the base advanced and GitHub had not
          # recomputed the ref yet — but then the real merge base sits behind that
          # parentless commit and git gives up with "no merge base".
          # The base SHA from the event payload is not a substitute — that is the
          # base branch tip, not the merge base, so diffing against it would fold
          # the base's own newer commits into this PR's diff, inverted.
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          merge_base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "diffing against merge base $merge_base"

          # Exclusions are read from the merge base, never from the PR head: a PR
          # must not be able to add its own files to the exclusion list and slip
          # past review. A change to the config therefore only takes effect once
          # it is merged.
          if git cat-file -e "$merge_base:$CONFIG_FILE" 2>/dev/null; then
            echo "reading exclusions from $CONFIG_FILE at the merge base"
            mapfile -t patterns < <(git show "$merge_base:$CONFIG_FILE" | yq '.exclude[]')
            if [ "${#patterns[@]}" -eq 0 ]; then
              echo "::warning::$CONFIG_FILE has no 'exclude' list; reviewing every changed file"
            fi
          else
            echo "no $CONFIG_FILE at the merge base; using the default exclusions"
            patterns=(
              # Documentation
              "*.md" "*.txt" "docs/**" "LICENSE"
              # Generated and lock files
              "*.lock" "**/target/**"
              # Binaries and media. *.svg is deliberately absent: it is text, it
              # can carry script, and excluding it would create a blind spot.
              "*.png" "*.jpg" "*.jpeg" "*.gif" "*.ico" "*.webp" "*.pdf"
              "*.zip" "*.jar" "*.class" "*.woff" "*.woff2" "*.ttf" "*.otf"
            )
          fi

          # YAML/workflow files are never excluded by default — CI configuration is
          # security-relevant and has to stay reviewable.
          pathspecs=()
          for pattern in "${patterns[@]}"; do
            [ -n "$pattern" ] && pathspecs+=(":(exclude)$pattern")
          done
          echo "excluding ${#pathspecs[@]} pattern(s) from the reviewed diff"

          git diff "$merge_base" HEAD -- . "${pathspecs[@]}" > pr.diff

          # Every changed file matched an exclusion, so there is nothing for the
          # reviewer to look at. Stop here rather than publishing an event: the
          # pipeline would embed an empty diff, which the embeddings API rejects
          # outright ("content contains an empty Part"), and `git apply --numstat`
          # below refuses an empty patch anyway.
          if [ ! -s pr.diff ]; then
            echo "reviewable=false" >> "$GITHUB_OUTPUT"
            echo "no reviewable files in this change; skipping the review pipeline"
            exit 0
          fi
          echo "reviewable=true" >> "$GITHUB_OUTPUT"

          echo "diff_key=prs/$PR_NUMBER/$SHA.diff" >> "$GITHUB_OUTPUT"

          # Lightweight stats derived from the same pr.diff already written
          # above (git apply --numstat reads a patch file directly, no
          # second git-diff invocation against the base branch) — these
          # ride along in the EventBridge event so route-model can decide
          # the complexity tier without fetching the full diff from S3.
          git apply --numstat pr.diff > pr.numstat

          files_changed=$(wc -l < pr.numstat | tr -d ' ')
          lines_added=$(awk -F'\t' '{ if ($1 != "-") sum += $1 } END { print sum+0 }' pr.numstat)
          lines_removed=$(awk -F'\t' '{ if ($2 != "-") sum += $2 } END { print sum+0 }' pr.numstat)
          paths_json=$(awk -F'\t' '{ print $3 }' pr.numstat | jq -R -s -c 'split("\n") | map(select(length > 0))')

          {
            echo "files_changed=$files_changed"
            echo "lines_added=$lines_added"
            echo "lines_removed=$lines_removed"
            echo "paths=$paths_json"
          } >> "$GITHUB_OUTPUT"

      # Nothing was excluded from the PR itself — every file is still there on
      # GitHub — but none of what changed is analysed, so say so rather than
      # leaving a silence that reads like the reviewer found nothing.
      - name: Report that there is nothing to review
        if: steps.diff.outputs.reviewable == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### No reviewable files"
            echo ""
            echo "Every file changed here matches the review exclusion list, so no diff"
            echo "was sent to the pipeline and no AI review will appear. The files are"
            echo "untouched on the pull request itself."
          } >> "$GITHUB_STEP_SUMMARY"

          gh pr comment "$PR_NUMBER" --body \
            "No automated review for this commit: every changed file matches the review exclusion list (documentation, generated files, binaries), so there was nothing to analyse. The files themselves are unaffected — this only skips the AI review."

      - name: Configure AWS credentials (OIDC)
        if: steps.diff.outputs.reviewable == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload diff to S3 (claim check)
        if: steps.diff.outputs.reviewable == 'true'
        env:
          ARTIFACTS_BUCKET_NAME: ${{ vars.ARTIFACTS_BUCKET_NAME }}
          DIFF_KEY: ${{ steps.diff.outputs.diff_key }}
        run: aws s3 cp pr.diff "s3://$ARTIFACTS_BUCKET_NAME/$DIFF_KEY"

      - name: Publish PRReviewRequested event
        if: steps.diff.outputs.reviewable == 'true'
        env:
          EVENT_BUS_NAME: ${{ vars.EVENT_BUS_NAME }}
          ARTIFACTS_BUCKET_NAME: ${{ vars.ARTIFACTS_BUCKET_NAME }}
          DIFF_KEY: ${{ steps.diff.outputs.diff_key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FILES_CHANGED: ${{ steps.diff.outputs.files_changed }}
          LINES_ADDED: ${{ steps.diff.outputs.lines_added }}
          LINES_REMOVED: ${{ steps.diff.outputs.lines_removed }}
          PATHS_JSON: ${{ steps.diff.outputs.paths }}
        run: |
          detail=$(jq -n \
            --argjson prNumber "$PR_NUMBER" \
            --arg repository "$REPOSITORY" \
            --arg sha "$SHA" \
            --arg diffBucket "$ARTIFACTS_BUCKET_NAME" \
            --arg diffKey "$DIFF_KEY" \
            --argjson filesChanged "$FILES_CHANGED" \
            --argjson linesAdded "$LINES_ADDED" \
            --argjson linesRemoved "$LINES_REMOVED" \
            --argjson paths "$PATHS_JSON" \
            '{prNumber: $prNumber, repository: $repository, sha: $sha, diffBucket: $diffBucket, diffKey: $diffKey, filesChanged: $filesChanged, linesAdded: $linesAdded, linesRemoved: $linesRemoved, paths: $paths}')

          entries=$(jq -n \
            --arg bus "$EVENT_BUS_NAME" \
            --arg detail "$detail" \
            '[{Source: "codereview.app", DetailType: "PRReviewRequested", EventBusName: $bus, Detail: $detail}]')

          # put-events answers 200 even when it rejects an entry, reporting the
          # rejection only in the body. Without this check a refused event looks
          # like a published one, and the review simply never arrives.
          response=$(aws events put-events --entries "$entries")
          failed=$(jq -r '.FailedEntryCount' <<<"$response")

          if [ "$failed" -gt 0 ]; then
            echo "::error::EventBridge rejected $failed of 1 entry"
            jq -r '.Entries[] | select(.ErrorCode) | "  \(.ErrorCode): \(.ErrorMessage)"' <<<"$response" >&2
            exit 1
          fi

          echo "event published: $(jq -r '.Entries[0].EventId' <<<"$response")"

      # Reaching here means no event was published, so no review will ever
      # appear on the PR. Say so where people actually look, instead of
      # leaving a silent gap that reads like the reviewer had no findings.
      - name: Report that the review was not triggered
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Automated review not triggered"
            echo ""
            echo "This job failed before publishing the review event, so no AI review will"
            echo "appear on this pull request. Merging is not blocked — only the \`test\` job"
            echo "gates it."
          } >> "$GITHUB_STEP_SUMMARY"

          gh pr comment "$PR_NUMBER" --body \
            "No automated review for this commit: the \`trigger-review\` job failed before publishing the event, so the pipeline never started. Merging is not blocked. [Run log]($RUN_URL)"
